services:
  - type: web
    name: mehran-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://mehran-sec.github.io,http://localhost:3000
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: GEMINI_API_KEY
        sync: false
